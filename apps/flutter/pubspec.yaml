name: nido
description: 'Nido — Finanzas del hogar para dos (Flutter universal app)'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # Official iOS-style icon font used by Flutter's adaptive Cupertino widgets.
  cupertino_icons: ^1.0.8

  # State management and dependency injection (FLT-004)
  flutter_riverpod: ^2.6.1

  # Declarative routing, deep links, web URL preservation (FLT-005)
  go_router: ^14.8.1

  # HTTP client with interceptors, timeouts and cancellation (FLT-008)
  dio: ^5.8.0

  # Firebase Auth with Google, preserving backend identity semantics (FLT-001).
  # Session material persists via each platform SDK's own storage (Keychain on
  # iOS, app-private storage on Android, Firebase browser persistence on Web) —
  # never shared preferences, never a JS "secure storage" simulation.
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1

  # Native Google credential flow for Android/iOS; Web uses Firebase popup.
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration testing
  integration_test:
    sdk: flutter

  # Official Flutter lint rules
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
