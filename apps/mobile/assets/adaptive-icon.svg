<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Nido</title>
  <!--
    Android's adaptive icon crops the foreground to a mask it chooses, so only the central 66% is
    guaranteed visible. The glyph is scaled to about 605px inside a 1024 canvas and centred, which
    clears every mask shape. No background: the launcher composites this over
    `adaptiveIcon.backgroundColor`, which carries the brand green the full icon uses.
    Colours come from `nido-glyph-dark.svg`, the variant drawn for dark backgrounds.
  -->
  <g transform="translate(512 512) scale(7.2) translate(-60 -60)">
    <path d="M26.2 72.3 A36 36 0 0 1 83.1 32.4" stroke="#E8E4DA" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M93.8 47.7 A36 36 0 0 1 36.9 87.6" stroke="#6FA895" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="14" fill="#CE8047"/>
  </g>
</svg>
