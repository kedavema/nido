name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORS_ORIGINS: http://localhost:8081
      DATABASE_URL: postgresql://nido:nido@localhost:5432/nido_ci
      FIREBASE_PROJECT_ID: nido-ci
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://nido:nido@localhost:5432/nido_ci
      EXPO_PUBLIC_API_URL: http://localhost:3000
      EXPO_PUBLIC_FIREBASE_API_KEY: nido-ci-public-api-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: nido-ci.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: nido-ci
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 000000000000-nido-ci.apps.googleusercontent.com

    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: nido_ci
          POSTGRES_PASSWORD: nido
          POSTGRES_USER: nido
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=nido --dbname=nido_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.13.1
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test PostgreSQL integration
        run: pnpm test:integration

      - name: Build workspaces
        run: pnpm build

  flutter:
    name: Flutter quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        working-directory: apps/flutter
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        working-directory: apps/flutter
        run: |
          dart format --output=none --set-exit-if-changed . || {
            echo "Formatting issues detected. Showing diff:"
            dart format .
            git diff -- .
            exit 1
          }

      - name: Analyze code
        working-directory: apps/flutter
        run: flutter analyze

      - name: Run tests
        working-directory: apps/flutter
        run: flutter test

      - name: Build Web
        working-directory: apps/flutter
        run: flutter build web

      # `flutter test` does not run `integration_test/`; it needs a real
      # runtime. The ubuntu runner image ships Chrome plus a matching
      # chromedriver (exposed via $CHROMEWEBDRIVER), so the startup test runs
      # headless against the web build without extra actions or devices.
      - name: Run integration tests (web)
        working-directory: apps/flutter
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          CHROMEDRIVER_PID=$!
          trap 'kill "$CHROMEDRIVER_PID"' EXIT
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_startup_test.dart \
            -d web-server --headless

      # From a clean clone: the runner image provides the Android SDK; the
      # Flutter Gradle plugin fetches the wrapper and remaining components.
      - name: Build Android (debug)
        working-directory: apps/flutter
        run: flutter build apk --debug

  flutter-ios:
    name: Flutter iOS build (no codesign)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          flutter-version: '3.29.0'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install dependencies
        working-directory: apps/flutter
        run: flutter pub get --enforce-lockfile

      - name: Build iOS simulator app
        working-directory: apps/flutter
        run: flutter build ios --simulator --no-codesign
